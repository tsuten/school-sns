# Default Configuration for SNS-for-U22 Startup Scripts
# This file contains default settings that can be overridden by environment-specific files

[ports]
django_default = 8000
sveltekit_dev_default = 5173
sveltekit_preview_default = 4173

[paths]
venv_default = .venv
frontend_default = web-frontend/app
backend_default = sns
requirements_default = requirements.txt
scripts_default = scripts

[database]
backup_before_reset = true
auto_migrate_dev = true
auto_migrate_prod = false
sqlite_file = sns/db.sqlite3

[dependencies]
python_min_version = 3.8
node_min_version = 16.0
pip_required = true
npm_required = true

[logging]
default_level = INFO
dev_level = INFO
prod_level = WARNING
log_dir = scripts/logs
max_log_size = 10MB
backup_count = 5

[timeouts]
dependency_check = 30
installation = 300
migration = 120
server_startup = 60
graceful_shutdown = 10
graceful_shutdown_prod = 30

[retry]
network_operations = 3
migration_attempts = 2
server_startup_attempts = 3

[cleanup]
temp_files = true
cache_files = true
log_rotation = true
old_backups = true
backup_retention_days = 7